<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeuGalo - Início</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card-duo">
    <img src="/images/LOGO-JEUGALO.png" alt="JeuGalo" style="width: 180px; margin-bottom: 20px;">
    <h1 style="color: var(--laranja-escuro); margin-bottom: 24px;">JeuGalo!</h1>
    
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <button class="btn-duo btn-green" onclick="location.href='player.html'">Sou Aluno (Entrar)</button>
      <button class="btn-duo btn-orange" onclick="openTeacherAuth()">Área do Professor</button>
    </div>
  </div>

  <div id="authModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
    <div class="card-duo" style="width: 320px;">
      <h2>Login Professor</h2>
      <input type="password" id="teacherPass" placeholder="Digite a Senha" style="width: 100%; padding: 12px; border-radius: 8px; margin: 16px 0; border: 2px solid var(--light-gray);">
      <button class="btn-duo btn-green" style="width: 100%;" onclick="loginTeacher()">Acessar</button>
    </div>
  </div>

  <script>
    function openTeacherAuth() { document.getElementById('authModal').style.display = 'flex'; }
    function loginTeacher() {
      const pass = document.getElementById('teacherPass').value;
      if (pass === 'Aletei4f!los') {
        window.location.href = 'host.html';
      } else {
        alert('Senha incorreta!');
      }
    }
  </script>
</body>
</html>
