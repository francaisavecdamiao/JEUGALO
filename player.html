<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeuGalo - Jogador</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="player-login" class="card-duo">
    <img src="/images/LOGO-JEUGALO.png" style="width: 120px;">
    <h2>Entrar no Jogo</h2>
    <input type="text" id="roomCode" placeholder="Código da Sala" style="width:100%; padding:12px; margin:10px 0; border-radius:12px; border:2px solid var(--light-gray);">
    <input type="text" id="nickname" placeholder="Seu Apelido" style="width:100%; padding:12px; margin:10px 0; border-radius:12px; border:2px solid var(--light-gray);">

    <h3>Escolha seu Galo</h3>
    <div class="carousel-container">
      <img id="avatar-prev" class="avatar-card prev" src="">
      <img id="avatar-active" class="avatar-card active" src="">
      <img id="avatar-next" class="avatar-card next" src="">
    </div>
    <p id="avatar-name" style="font-family: Feather-Bold; margin-bottom: 15px; color: var(--laranja-escuro);">ADÈLE</p>
    
    <div style="display: flex; justify-content: space-between; gap: 10px; margin-bottom: 15px;">
      <button class="btn-duo btn-blue" style="flex: 1;" onclick="moveCarousel(-1)">◄ Ante.</button>
      <button class="btn-duo btn-blue" style="flex: 1;" onclick="moveCarousel(1)">Próx. ►</button>
    </div>

    <button class="btn-duo btn-green" style="width: 100%; font-size: 1.2rem;" onclick="joinRoom()">Entrar</button>
  </div>

  <div id="player-wait" class="card-duo" style="display: none;">
    <img src="/images/LOGO-JEUGALO.png" style="width: 150px; margin-bottom: 20px;">
    <h2>Aguardando o professor iniciar o jogo...</h2>
  </div>

  <div id="player-gameplay" style="display: none; width: 100vw; height: 100vh; padding: 20px;">
    <div class="shape-grid" style="height: 100%;">
      <div class="shape-btn shape-red" onclick="sendAnswer(0)">▲</div>
      <div class="shape-btn shape-blue" onclick="sendAnswer(1)">◆</div>
      <div class="shape-btn shape-yellow" onclick="sendAnswer(2)">●</div>
      <div class="shape-btn shape-green" onclick="sendAnswer(3)">■</div>
    </div>
  </div>

  <div id="player-feedback" class="card-duo" style="display: none;">
    <h1 id="feedbackText"></h1>
    <img id="feedbackImg" src="" style="width: 200px; margin-top: 20px;">
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
